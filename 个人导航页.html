<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XX的个人导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        'primary-hover': '#4f46e5',
                        accent: '#06b6d4',
                        surface: '#1e293b',
                        'surface-light': '#334155'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'system-ui', '-apple-system', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite'
                    }
                }
            }
        }
    </script>

    <style>
        /* ========== 基础变量 ========== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.14);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-hover: rgba(255, 255, 255, 0.12);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.15);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.25);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --card-bg: rgba(255, 255, 255, 0.5);
            --card-hover: rgba(255, 255, 255, 0.75);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
        }

        /* ========== 全局 ========== */
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-image 0.8s ease-in-out;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }

        /* 选择文本 */
        ::selection { background: rgba(99, 102, 241, 0.4); color: #fff; }

        /* ========== 背景层 ========== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .bg-video {
            position: fixed;
            inset: 0;
            z-index: -3;
            object-fit: cover;
            width: 100%;
            height: 100%;
            display: none;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            transition: backdrop-filter 0.5s ease;
        }

        /* ========== 动画关键帧 ========== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-fade-in  { animation: fadeIn 0.4s ease-out both; }
        .animate-slide-up { animation: slideUp 0.5s ease-out both; }
        .animate-scale-in { animation: scaleIn 0.3s ease-out both; }

        /* ========== 玻璃效果工具类 ========== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .glass-hover:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.25);
        }

        /* ========== 搜索区域 ========== */
        .search-wrapper {
            transition: transform var(--transition);
        }
        .search-wrapper:focus-within {
            transform: scale(1.02);
        }
        .search-bar {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .search-wrapper:focus-within .search-bar {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2), 0 8px 32px rgba(0,0,0,0.2);
        }
        /* 自定义搜索引擎下拉 */
        .engine-dropdown {
            position: relative;
            flex-shrink: 0;
        }
        .engine-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            color: #e2e8f0;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition);
            user-select: none;
        }
        .engine-dropdown-trigger:hover { background: rgba(255,255,255,0.15); }
        .engine-dropdown.open .engine-dropdown-trigger {
            border-color: #818cf8;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
        }
        .engine-dropdown-trigger .arrow {
            font-size: 10px;
            transition: transform var(--transition);
            opacity: 0.6;
        }
        .engine-dropdown.open .engine-dropdown-trigger .arrow {
            transform: rotate(180deg);
        }
        .engine-dropdown-menu {
            /* position: fixed; */
            min-width: 180px;
            background: rgba(30,41,59,0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            z-index: 9999;
            display: none;
        }
        .engine-dropdown.open .engine-dropdown-menu { display: flex;}
        .engine-dropdown-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all 0.15s ease;
        }
        .engine-dropdown-option:hover {
            background: rgba(255,255,255,0.1);
            color: #f1f5f9;
        }
        .engine-dropdown-option.selected {
            background: rgba(99,102,241,0.2);
            color: #a5b4fc;
        }

        .search-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-primary);
            border-radius: 999px;
            padding: 14px 48px 14px 20px;
            font-size: 15px;
            width: 100%;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition);
        }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2), 0 8px 32px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.13);
        }

        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px rgba(99,102,241,0.35);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(99,102,241,0.5);
            transform: translateY(-1px);
        }
        .btn-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
        .btn-glass:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239,68,68,0.3);
            color: #fecaca;
        }

        /* ========== 分类标签 ========== */
        .category-tab {
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .category-tab:hover {
            background: rgba(255,255,255,0.12);
            color: var(--text-primary);
        }
        .category-tab.active {
            background: rgba(99,102,241,0.25);
            border-color: rgba(129,140,248,0.5);
            color: #a5b4fc;
            box-shadow: 0 2px 12px rgba(99,102,241,0.2);
        }

        /* ========== 网站卡片 ========== */
        .site-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .site-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
            pointer-events: none;
        }
        .site-card:hover {
            background: var(--card-hover);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        }
        .site-card:active { transform: scale(0.97); }

        .site-card .icon-wrap {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255,255,255,0.08);
            transition: all var(--transition);
        }
        .site-card:hover .icon-wrap {
            background: rgba(255,255,255,0.15);
            transform: scale(1.08);
        }
        .site-card .icon-wrap img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: contain;
        }
        .site-card .icon-wrap i {
            font-size: 24px;
            color: #818cf8;
        }
        .site-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .site-card .category-badge {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 拖拽状态 */
        .site-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }
        .site-card.drag-over {
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.4), 0 8px 24px rgba(99,102,241,0.2);
        }

        /* ========== 模态框 ========== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal {
            background: rgba(30,41,59,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 28px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-wide {
            max-width: 720px;
        }
        .modal h2 {
            margin: 0 0 24px;
            font-size: 20px;
            font-weight: 700;
        }
        .modal label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .modal input[type="text"],
        .modal input[type="url"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            transition: all var(--transition);
        }
        .modal input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        /* ========== 壁纸网格 ========== */
        .wallpaper-option {
            aspect-ratio: 16/10;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            background-color: rgba(255,255,255,0.05);
        }
        .wallpaper-option.loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: shimmer 1.5s infinite;
            z-index: 1;
        }
        .wallpaper-option:hover {
            border-color: #818cf8;
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .wallpaper-option::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.4));
            opacity: 0;
            transition: opacity var(--transition);
            z-index: 0;
        }
        .wallpaper-option:hover::after { opacity: 1; }
        .wallpaper-option .wallpaper-label {
            position: absolute;
            bottom: 6px;
            left: 8px;
            font-size: 11px;
            color: #fff;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .wallpaper-option:hover .wallpaper-label { opacity: 1; }
        .wallpaper-option.is-default {
            border-style: dashed;
            border-color: rgba(255,255,255,0.25);
        }

        /* ========== 右键菜单 ========== */
        .context-menu {
            position: fixed;
            background: rgba(15,23,42,0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 6px;
            min-width: 180px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            z-index: 200;
        }
        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #e2e8f0;
        }
        .context-menu-item:hover {
            background: rgba(99,102,241,0.2);
            color: #a5b4fc;
        }
        .context-menu-item.danger:hover {
            background: rgba(239,68,68,0.2);
            color: #fca5a5;
        }

        /* ========== Toast ========== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }
        .toast.success { background: rgba(16,185,129,0.25); color: #6ee7b7; }
        .toast.error   { background: rgba(239,68,68,0.25); color: #fca5a5; }
        .toast.info    { background: rgba(99,102,241,0.25); color: #a5b4fc; }

        /* ========== 滑块 ========== */
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #818cf8;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(99,102,241,0.4);
        }

        /* ========== 标题渐变 ========== */
        .title-gradient {
            background: linear-gradient(135deg, #e0e7ff 0%, #a5f3fc 50%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.light-mode .title-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #0891b2 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .modal { padding: 20px; border-radius: var(--radius); }
            .btn { padding: 8px 16px; font-size: 13px; }
            .site-card { padding: 14px 10px; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <video id="bgVideo" class="bg-video" muted autoplay loop playsinline></video>
    <div class="bg-overlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="container mx-auto px-4 py-8 max-w-6xl" style="position:relative;z-index:1;">

        <!-- ==================== 头部 ==================== -->
        <header class="mb-8 text-center animate-fade-in">
            <h1 class="text-[clamp(1.8rem,5vw,3.2rem)] font-extrabold title-gradient mb-2 tracking-tight">
                YSL的个人导航
            </h1>
            <p class="text-sm opacity-50 mb-6" id="clockDisplay"></p>

            <!-- 主搜索框 -->
            <div class="max-w-2xl mx-auto mb-6">
                <div class="search-wrapper relative">
                    <div class="search-bar flex items-center gap-0">
                        <div id="searchEngine" class="engine-dropdown ml-2">
                            <div class="engine-dropdown-trigger">
                                <span class="engine-label">🔍 Bing</span>
                                <i class="fa-solid fa-chevron-down arrow"></i>
                            </div>
                            <div class="engine-dropdown-menu">
                                <div class="engine-dropdown-option selected" data-value="https://www.bing.com/search?q=" data-label="🔍 Bing">🔍 Bing</div>
                                <div class="engine-dropdown-option" data-value="https://search.bilibili.com/all?keyword=" data-label="📺 哔哩哔哩">📺 哔哩哔哩</div>
                                <div class="engine-dropdown-option" data-value="https://juejin.cn/search?query=" data-label="💎 稀土掘金">💎 稀土掘金</div>
                                <div class="engine-dropdown-option" data-value="https://github.com/search?q=" data-label="🐙 GitHub">🐙 GitHub</div>
                                <div class="engine-dropdown-option" data-value="https://so.csdn.net/so/search?spm=1000.2115.3001.4498&q=" data-label="📝 CSDN">📝 CSDN</div>
                                <div class="engine-dropdown-option" data-value="https://www.google.com/search?q=" data-label="🌐 Google">🌐 Google</div>
                            </div>
                        </div>
                        <input type="text" id="webSearchInput"
                               class="flex-1 bg-transparent border-none outline-none text-[var(--text-primary)] placeholder-[var(--text-secondary)] text-[15px] py-3.5 px-3"
                               placeholder="搜索你想要的...">
                        <button id="webSearchBtn"
                                class="btn btn-primary mr-2 !py-2 !px-5 text-sm">
                            <i class="fa-solid fa-magnifying-glass"></i> 搜索
                        </button>
                    </div>
                </div>

                <!-- 网站搜索 -->
                <div class="relative mt-3">
                    <i class="fa-solid fa-bookmark absolute left-4 top-1/2 -translate-y-1/2 text-[var(--text-secondary)] text-sm"></i>
                    <input type="text" id="siteSearchInput"
                           class="search-input pl-10 pr-4 !py-2.5 text-sm"
                           placeholder="搜索已收藏的网站...">
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-center gap-3 mb-6 flex-wrap">
                <button id="addSiteBtn" class="btn btn-primary">

                bgVideo.style.display = 'none';
                bgVideo.pause();
                bgVideo.src = '';
                if (bgLayer) {
                    bgLayer.style.backgroundImage = `url('${url}')`;
                }
                document.body.style.backgroundImage = `url('${url}')`;
            }

            if (bgOverlay) {
                const alpha = (1 - brightness).toFixed(2);
                bgOverlay.style.background = `rgba(0,0,0,${alpha})`;
                bgOverlay.style.backdropFilter = `blur(${blur}px)`;
                bgOverlay.style.webkitBackdropFilter = `blur(${blur}px)`;
            }

            saveBackground(url, brightness, blur);

        function filterWebsites(category) {

        // ==================== 渲染卡片 ====================
        function renderWebsites(filtered = websites) {
            websitesGrid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                websitesGrid.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            websitesGrid.classList.remove('hidden');

            filtered.forEach((site, idx) => {
                const card = document.createElement('div');
                card.className = 'site-card';
                card.dataset.id = site.id;
                card.style.animationDelay = `${idx * 0.03}s`;
                card.classList.add('animate-fade-in');

                // 图标HTML
                let iconHtml = '';
                if (site.icon && site.icon.startsWith('fa-')) {
                    iconHtml = `<i class="fa-solid ${site.icon.replace('fa-', '')}"></i>`;
                } else if (site.icon && (site.icon.startsWith('http') || site.icon.startsWith('/'))) {
                    iconHtml = `<img src="${site.icon}" alt="${site.name}" loading="lazy" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-globe\'></i>'">`;
                } else {
                    try {
                        const faviconUrl = `https://www.google.com/s2/favicons?domain=${new URL(site.url).hostname}&sz=64`;
                        iconHtml = `<img src="${faviconUrl}" alt="${site.name}" loading="lazy" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-globe\'></i>'">`;
                    } catch {
                        iconHtml = `<i class="fa-solid fa-globe"></i>`;
                    }
                }

                card.innerHTML = `
                    <div class="icon-wrap">${iconHtml}</div>
                    <h3 title="${site.name}">${site.name}</h3>
                    <p class="category-badge" title="${site.category}">${site.category}</p>
                `;

                // 点击打开
                card.addEventListener('click', (e) => {
                    if (card.classList.contains('dragging')) return;
                    window.open(site.url, '_blank');
                });

                // 右键菜单
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, site.id);
                });

                // 中键点击
                card.addEventListener('auxclick', (e) => {
                    if (e.button === 1) {
                        e.preventDefault();
                        window.open(site.url, '_blank');
                    }
                });

                // 拖拽
                card.setAttribute('draggable', 'true');
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);

                websitesGrid.appendChild(card);
            });
        }

        // ==================== 拖拽 ====================
        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragEnd() {
            draggedItem = null;
            $$('.site-card').forEach(c => {
                c.classList.remove('dragging', 'drag-over');
            });

            const newOrder = Array.from(websitesGrid.children).map(c => parseInt(c.dataset.id));

            if (newOrder.length === websites.length) {
                // 全部显示 — 整体重排
                websites = newOrder.map(id => websites.find(s => s.id === id)).filter(Boolean);
            } else {
                // 过滤视图 — 只改变可见项之间的相对顺序，保持它们在原数组中的位置槽
                const visibleSet = new Set(newOrder);
                const reorderedVisible = newOrder.map(id => websites.find(s => s.id === id)).filter(Boolean);
                let vi = 0;
                websites = websites.map(s => {
                    if (visibleSet.has(s.id)) {
                        return reorderedVisible[vi++];
                    }
                    return s;
                });
            }
            saveData();
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            if (this !== draggedItem) {
                $$('.site-card').forEach(c => c.classList.remove('drag-over'));
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (draggedItem && draggedItem !== this) {
                const after = isElementAfter(draggedItem, this);
                if (after) {
                    websitesGrid.insertBefore(draggedItem, this.nextElementSibling);
                } else {
                    websitesGrid.insertBefore(draggedItem, this);
                }
            }
        }

        function isElementAfter(el1, el2) {
            let cur = el1.nextElementSibling;
            while (cur) {
                if (cur === el2) return true;
                cur = cur.nextElementSibling;
            }
            return false;
        }

        // ==================== Edge 原生壁纸系统 ====================
        const videoThumbCache = {};

        function generateVideoThumb(url, callback) {
            if (videoThumbCache[url] !== undefined) {
                callback(videoThumbCache[url]);
                return;
            }
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.preload = 'metadata';
            video.muted = true;
            video.playsInline = true;
            let done = false;
            video.onloadeddata = () => { if (!done) { video.currentTime = 0.1; } };
            video.onseeked = () => {
                if (done) return;
                done = true;
                const canvas = document.createElement('canvas');
                canvas.width = THUMB_SIZE;
                canvas.height = Math.round(THUMB_SIZE * 0.6);
                const ctx = canvas.getContext('2d');
                try {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    videoThumbCache[url] = canvas.toDataURL('image/jpeg', 0.6);
                } catch (e) {
                    videoThumbCache[url] = null;
                }
                video.remove();
                callback(videoThumbCache[url]);
            };
            video.onerror = () => {
                if (done) return;
                done = true;
                videoThumbCache[url] = null;
                video.remove();
                callback(null);
            };
            video.src = url;
            video.load();
        }

        function buildEdgeWallpapers(bingImages) {
            const list = [];
            // 静态壁纸
            EDGE_STATIC.forEach((s, i) => {
                list.push({ url: s.url, type: 'image', label: s.label, thumb: s.url });
            });
            // Bing每日壁纸
            (bingImages || []).forEach((img, i) => {
                const fullUrl = 'https://www.bing.com' + img.url;
                list.push({ url: fullUrl, type: 'image', label: 'Bing · ' + (img.copyright || '每日 ' + (i + 1)), thumb: fullUrl });
            });
            // 视频壁纸
            EDGE_VIDEOS.forEach((url, i) => {
                list.push({ url: url, type: 'video', label: 'Edge视频 · ' + (i + 1), thumb: null });
            });
            return list;
        }

        let currentEdgeWallpapers = [];
        let thumbQueue = [];
        let thumbTimer = null;
        let cachedBingImages = null;

        function processThumbQueue() {
            if (thumbQueue.length === 0) { thumbTimer = null; return; }
            const batch = thumbQueue.splice(0, 3);
            batch.forEach(item => {
                generateVideoThumb(item.url, (thumb) => {
                    item.thumb = thumb;
                    if (item.el) {
                        if (thumb) {
                            item.el.style.backgroundImage = `url('${thumb}')`;
                        }
                        item.el.classList.remove('loading');
                    }
                });
            });
            thumbTimer = setTimeout(processThumbQueue, 600);
        }

        function stopThumbQueue() {
            if (thumbTimer) { clearTimeout(thumbTimer); thumbTimer = null; }
            thumbQueue = [];
        }

        function renderEdgeWallpapers(wallpapers, currentBgUrl) {
            const grid = $('#edgeWallpaperGrid');
            grid.innerHTML = '';
            thumbQueue = [];
            if (thumbTimer) clearTimeout(thumbTimer);

            wallpapers.forEach((wp, i) => {
                const div = document.createElement('div');
                div.className = 'wallpaper-option';
                div.title = wp.label;

                if (wp.type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        div.style.backgroundImage = `url('${wp.thumb}')`;
                        div.classList.remove('loading');
                    };
                    img.onerror = () => div.classList.remove('loading');
                    div.classList.add('loading');
                    img.src = wp.thumb;
                } else {
                    // 视频：显示加载状态，后台生成缩略图
                    div.classList.add('loading');
                    const playIcon = document.createElement('i');
                    playIcon.className = 'fa-solid fa-play';
                    playIcon.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;opacity:0.5;z-index:2;pointer-events:none;';
                    div.appendChild(playIcon);
                    thumbQueue.push({ url: wp.url, el: div });
                }

                // 标签
                const label = document.createElement('span');
                label.className = 'wallpaper-label';
                label.textContent = wp.label;
                div.appendChild(label);

                // 高亮当前使用
                if (currentBgUrl === wp.url) {
                    div.style.borderColor = '#818cf8';
                }

                // 点击应用
                div.addEventListener('click', () => {
                    $('#bgUrl').value = wp.url;
                    const brightness = parseFloat($('#bgBrightness').value);
                    const blur = parseInt($('#bgBlur').value);
                    applyBackground(wp.url, brightness, blur);
                    showToast('壁纸已切换', 'success');
                    // 更新高亮
                    grid.querySelectorAll('.wallpaper-option').forEach(el => el.style.borderColor = '');
                    div.style.borderColor = '#818cf8';
                });

                // 保存引用用于缩略图更新
                wp.el = div;
                grid.appendChild(div);
            });

            // 开始处理缩略图队列
            if (thumbQueue.length > 0) {
                processThumbQueue();
            }

            // 更新计数
            const countEl = $('#edgeWallCount');
            if (countEl) countEl.textContent = `${wallpapers.length} 张`;
        }

        // ==================== 随机壁纸 ====================

        // 生成随机壁纸数据（仅URL，图片由浏览器直接加载）
        function generateRandomWallpapers(count) {
            const wallpapers = [];
            const usedRandoms = new Set();
            // 使用大量随机种子，避免重复
            const seedPool = Array.from({ length: 500 }, (_, i) => i + 1);
            // Fisher-Yates 部分洗牌取前 count 个
            for (let i = 0; i < count; i++) {
                const j = i + Math.floor(Math.random() * (seedPool.length - i));
                [seedPool[i], seedPool[j]] = [seedPool[j], seedPool[i]];
            }
            for (let i = 0; i < count; i++) {
                const seed = seedPool[i];
                wallpapers.push({
                    thumb: `https://picsum.photos/seed/${seed}/${THUMB_SIZE}/${Math.round(THUMB_SIZE * 0.6)}`,
                    full: `https://picsum.photos/seed/${seed}/${FULL_W}/${FULL_H}`,
                    label: `随机 #${seed}`
                });
            }
            return wallpapers;
        }

        let currentWallpapers = [];

        function renderWallpaperGrid(wallpapers, currentBgUrl) {
            const grid = $('#wallpaperGrid');
            grid.innerHTML = '';

            // 如果当前背景是之前选中的随机壁纸，放在首位
            if (currentBgUrl && currentBgUrl.includes('picsum.photos/seed/')) {
                const seedMatch = currentBgUrl.match(/\/seed\/(\d+)\//);
                if (seedMatch) {
                    const seed = seedMatch[1];
                    const currentWp = {
                        thumb: `https://picsum.photos/seed/${seed}/${THUMB_SIZE}/${Math.round(THUMB_SIZE * 0.6)}`,
                        full: currentBgUrl,
                        label: `当前使用 #${seed}`
                    };
                    wallpapers = [currentWp, ...wallpapers];
                }
            }

            // 如果当前背景是本地默认图也放在前面提示
            if (currentBgUrl && (currentBgUrl === DEFAULT_BG.url || currentBgUrl.endsWith('bg.jpg'))) {
                const currentWp = {
                    thumb: DEFAULT_BG.url,
                    full: DEFAULT_BG.url,
                    label: '当前使用 · 默认'
                };
                wallpapers = [currentWp, ...wallpapers];
            }

            // 随机壁纸（低像素缩略图预览）
            wallpapers.forEach(wp => {
                const div = document.createElement('div');
                div.className = 'wallpaper-option loading';
                div.title = wp.label;

                // 低像素缩略图 — 浏览器直接加载，不存储
                const img = new Image();
                img.onload = () => {
                    div.style.backgroundImage = `url('${wp.thumb}')`;
                    div.classList.remove('loading');
                };
                img.onerror = () => {
                    div.classList.remove('loading');
                };
                img.src = wp.thumb;

                // 标签
                const label = document.createElement('span');
                label.className = 'wallpaper-label';
                label.textContent = wp.label;
                div.appendChild(label);

                // 点击应用全分辨率（seed 保证同图不同分辨率一致）
                div.addEventListener('click', () => {
                    $('#bgUrl').value = wp.full;
                    const brightness = parseFloat($('#bgBrightness').value);
                    const blur = parseInt($('#bgBlur').value);
                    applyBackground(wp.full, brightness, blur);
                    showToast('壁纸已切换', 'success');
                });
                grid.appendChild(div);
            });

            // 默认壁纸（保底，排最后）
            const isDefaultAlreadyShown = currentBgUrl && (currentBgUrl === DEFAULT_BG.url || currentBgUrl.endsWith('bg.jpg'));
            if (!isDefaultAlreadyShown) {
                const defaultDiv = document.createElement('div');
                defaultDiv.className = 'wallpaper-option is-default';
                defaultDiv.style.backgroundImage = `url('${DEFAULT_BG.url}')`;
                defaultDiv.title = DEFAULT_BG.label;
                const defaultLabel = document.createElement('span');
                defaultLabel.className = 'wallpaper-label';
                defaultLabel.textContent = '默认';
                defaultDiv.appendChild(defaultLabel);
                defaultDiv.addEventListener('click', () => {
                    $('#bgUrl').value = DEFAULT_BG.url;
                    const brightness = parseFloat($('#bgBrightness').value);
                    const blur = parseInt($('#bgBlur').value);
                    applyBackground(DEFAULT_BG.url, brightness, blur);
                    showToast('已切换为默认壁纸', 'success');
                });
                grid.appendChild(defaultDiv);
            }
        }

        function openChangeBgModal() {
            changeBgModal.classList.remove('hidden');

            // 获取当前背景设置
            let currentBgUrl = '';
            const savedBg = localStorage.getItem('navigation_background');
            if (savedBg) {
                try {
                    const d = JSON.parse(savedBg);
                    currentBgUrl = d.url || '';
                    $('#bgBrightness').value = d.brightness;
                    $('#bgBlur').value = d.blur;
                    $('#bgBrightnessValue').textContent = `${Math.round(d.brightness * 100)}%`;
                    $('#bgBlurValue').textContent = `${d.blur}px`;
                    $('#bgUrl').value = d.url;
                } catch(e) {}
            }

            // 先用本地数据渲染Edge壁纸（含缓存的Bing）
            currentEdgeWallpapers = buildEdgeWallpapers(cachedBingImages);
            renderEdgeWallpapers(currentEdgeWallpapers, currentBgUrl);

            // 异步拉取Bing每日壁纸（首次拉取后缓存）
            if (!cachedBingImages) {
                fetch(BING_API)
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.images && data.images.length > 0) {
                            cachedBingImages = data.images;
                            currentEdgeWallpapers = buildEdgeWallpapers(cachedBingImages);
                            renderEdgeWallpapers(currentEdgeWallpapers, currentBgUrl);
                        }
                    })
                    .catch(() => {});
            }

            // 生成随机壁纸并渲染（当前使用的壁纸会排在首位）
            currentWallpapers = generateRandomWallpapers(WALLPAPER_COUNT);
            renderWallpaperGrid(currentWallpapers, currentBgUrl);
        }

        function autoFetchSiteInfo() {

                showToast('请先输入网站地址', 'error');

            }
            try {
                const hostname = new URL(url).hostname;
                const parts = hostname.split('.');
                let name = parts[0] === 'www' ? (parts[1] || '网站') : parts[0];
                name = name.charAt(0).toUpperCase() + name.slice(1);
                $('#siteName').value = name;

                const faviconUrl = `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;
                $('#siteIcon').value = faviconUrl;
                updateIconPreview(faviconUrl);

                // 智能分类
                const catMap = [
                    { keys: ['baidu', 'bing', 'google', 'yahoo', 'duckduckgo', 'sogou'], cat: '搜索引擎' },
                    { keys: ['github', 'gitlab', 'gitee', 'stackoverflow'], cat: '开发工具' },
                    { keys: ['bilibili', 'youtube', 'youku', 'douyin', 'tiktok'], cat: '视频娱乐' },
                    { keys: ['zhihu', 'quora', 'juejin', 'csdn'], cat: '技术社区' },
                    { keys: ['chatgpt', 'openai', 'deepseek', 'doubao', 'ai'], cat: 'AI' }
                ];
                let category = '其他';
                for (const { keys, cat } of catMap) {
                    if (keys.some(k => hostname.includes(k))) { category = cat; break; }
                }
                $('#siteCategory').value = category;
                showToast('网站信息已自动填充', 'info');
            } catch {
                showToast('无法解析网站地址，请检查URL格式', 'error');
            }
        }

        // ==================== 配置导入导出 ====================
        function exportConfig() {
            const config = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                websites: JSON.parse(localStorage.getItem('navigation_websites') || '[]'),
                background: JSON.parse(localStorage.getItem('navigation_background') || '{}'),
                theme: localStorage.getItem('navigation_theme'),
                searchEngine: localStorage.getItem('navigation_search_engine')
            };
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `navigation-config-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('配置已导出', 'success');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    if (!config.websites) {
                        showToast('配置文件格式不正确', 'error');
                        return;
                    }
                    if (config.websites) localStorage.setItem('navigation_websites', JSON.stringify(config.websites));
                    if (config.background) localStorage.setItem('navigation_background', JSON.stringify(config.background));
                    if (config.theme) localStorage.setItem('navigation_theme', config.theme);
                    if (config.searchEngine) localStorage.setItem('navigation_search_engine', config.searchEngine);
                    showToast('配置导入成功，即将刷新...', 'success');
                    setTimeout(() => location.reload(), 800);
                } catch (err) {
                    showToast('配置文件解析失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==================== 事件绑定 ====================
        function initEvents() {
            // 添加网站
            $('#addSiteBtn').addEventListener('click', () => openAddSiteModal());
            $('#emptyAddBtn').addEventListener('click', () => openAddSiteModal());

            $('#closeModalBtn').addEventListener('click', closeAddSiteModal);
            addSiteModal.addEventListener('click', (e) => { if (e.target === addSiteModal) closeAddSiteModal(); });

            // 壁纸
            $('#changeBgBtn').addEventListener('click', openChangeBgModal);
            $('#shuffleBgBtn').addEventListener('click', shuffleWallpapers);

            $('#closeBgModalBtn').addEventListener('click', closeChangeBgModal);
            changeBgModal.addEventListener('click', (e) => { if (e.target === changeBgModal) closeChangeBgModal(); });

            // 表单提交
            $('#addSiteForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = $('#siteName').value.trim();
                const url = $('#siteUrl').value.trim();
                const category = $('#siteCategory').value.trim();
                const icon = $('#siteIcon').value.trim();

                if (!name || !url || !category) {
                    showToast('请填写完整信息', 'error');
                    return;
                }

                if (currentEditId) {
                    const idx = websites.findIndex(s => s.id === currentEditId);
                    if (idx !== -1) websites[idx] = { ...websites[idx], name, url, category, icon };
                    showToast('网站已更新', 'success');
                } else {
                    websites.push({ id: Date.now(), name, url, category, icon });
                    showToast('网站已添加', 'success');
                }
                saveData();
                closeAddSiteModal();
            });

            // 图标选项
            $$('.icon-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const icon = opt.dataset.icon;
                    $('#siteIcon').value = icon;
                    updateIconPreview(icon);
                });
            });

            $('#siteIcon').addEventListener('input', (e) => updateIconPreview(e.target.value));
            $('#autoFetchBtn').addEventListener('click', autoFetchSiteInfo);

            // 主题
            $('#themeToggleBtn').addEventListener('click', () => {
                const current = localStorage.getItem('navigation_theme') || APP_CONFIG.defaultTheme;
                applyTheme(current === 'dark' ? 'light' : 'dark');
            });

            // 清除数据
            $('#clearStorageBtn').addEventListener('click', () => {
                if (confirm('确定要清除所有数据吗？此操作不可恢复。')) {
                    ['navigation_websites', 'navigation_background', 'navigation_theme', 'navigation_search_engine']
                        .forEach(k => localStorage.removeItem(k));
                    location.reload();
                }
            });

            // 网站搜索
            $('#siteSearchInput').addEventListener('input', () => {
                const active = ($('.category-tab.active') || {}).dataset?.category || 'all';
                filterWebsites(active);
            });

            // 网络搜索
            const doSearch = () => {
                const query = $('#webSearchInput').value.trim();
                if (!query) return;
                const engine = currentEngineValue;

                if (/^https?:\/\//i.test(query)) {
                    window.open(query, '_blank');
                    return;
                }

                let url = `${engine}${encodeURIComponent(query)}`;
                if (engine.includes('so.csdn.net')) url += '&t=&u=';
                else if (engine.includes('juejin.cn')) url += '&fromSeo=1&fromHistory=0&fromSuggest=0';
                else if (engine.includes('github.com')) url += '&type=repositories';

                window.open(url, '_blank');
            };

            $('#webSearchBtn').addEventListener('click', doSearch);
            $('#webSearchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doSearch();
            });

            // 自定义搜索引擎下拉（fixed定位突破父级backdrop-filter堆叠上下文）
            searchEngineTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = searchEngineEl.classList.toggle('open');
                if (isOpen) {
                    const rect = searchEngineTrigger.getBoundingClientRect();
                    const menu = searchEngineEl.querySelector('.engine-dropdown-menu');
                    menu.style.top = `${rect.bottom + 6}px`;
                    menu.style.left = `${rect.left}px`;
                }
            });
            // 滚动/窗口变化时关闭下拉（防止位置错位）
            window.addEventListener('resize', () => searchEngineEl.classList.remove('open'));
            window.addEventListener('scroll', () => searchEngineEl.classList.remove('open'), true);
            searchEngineOptions.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentEngineValue = opt.dataset.value;
                    searchEngineLabel.textContent = opt.dataset.label;
                    searchEngineOptions.forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    searchEngineEl.classList.remove('open');
                    saveSearchEngine(currentEngineValue);
                });
            });
            document.addEventListener('click', () => searchEngineEl.classList.remove('open'));

            // 导入导出
            $('#exportConfigBtn').addEventListener('click', exportConfig);
            $('#importConfigBtn').addEventListener('click', () => $('#configFileInput').click());
            $('#configFileInput').addEventListener('change', importConfig);

            // 背景滑块
            $('#bgBrightness').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                $('#bgBrightnessValue').textContent = `${Math.round(val * 100)}%`;
                const saved = JSON.parse(localStorage.getItem('navigation_background') || '{}');
                applyBackground(saved.url || APP_CONFIG.defaultBg, val, saved.blur || 0);
            });

            $('#bgBlur').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                $('#bgBlurValue').textContent = `${val}px`;
                const saved = JSON.parse(localStorage.getItem('navigation_background') || '{}');
                applyBackground(saved.url || APP_CONFIG.defaultBg, saved.brightness || 0.8, val);
            });

            $('#applyBgUrlBtn').addEventListener('click', () => {
                const url = $('#bgUrl').value.trim();
                if (url) {
                    applyBackground(url, parseFloat($('#bgBrightness').value), parseInt($('#bgBlur').value));
                    showToast('壁纸已应用', 'success');
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    $('#webSearchInput').focus();
                }
                if (e.key === 'Escape') {
                    closeAddSiteModal();
                    closeChangeBgModal();
                    contextMenu.classList.add('hidden');
                }
            });
        }

        // ==================== 自动全屏 ====================
        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {
                    // 浏览器阻止了自动全屏，首次点击时再尝试
                    const handler = () => {
                        el.requestFullscreen().catch(() => {});
                        document.removeEventListener('click', handler);
                    };
                    document.addEventListener('click', handler);
                });
            }
        }

        // ==================== 启动 ====================
        function initApp() {
            loadData();
            updateCategoryTabs();
            renderWebsites();
            initEvents();

            // 默认激活"全部"标签
            const allTab = categoryTabs.querySelector('[data-category="all"]');
            if (allTab) allTab.classList.add('active');

            // 尝试进入全屏
            enterFullscreen();
        }
		window.onload(){
			// 尝试进入全屏
			enterFullscreen();
		}

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
